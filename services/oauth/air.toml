# Run from this directory: air -c air.toml
# Env is loaded from .realize.yaml, then MySQL is overridden for local Air runs.
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/oauth"
  cmd = "go build -o ./tmp/oauth ."
  delay = 1000
  exclude_dir = [".git", ".realize", "vendor", "tmp"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = "ruby -ryaml -e 'config = YAML.load_file(\".realize.yaml\"); schema = config.fetch(\"schema\").first; env = schema.fetch(\"env\", {}).transform_values(&:to_s); local_mysql = { \"WETIX_MYSQL_HOST\" => \"localhost\", \"WETIX_MYSQL_PORT\" => \"3306\", \"WETIX_MYSQL_USERNAME\" => \"root\", \"WETIX_MYSQL_PASSWORD\" => \"123456\", \"WETIX_MYSQL_DATABASE\" => \"wetix\" }; ENV.update(env.merge(local_mysql)); exec \"./tmp/oauth\"'"
  include_dir = ["."]
  include_ext = ["go"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = ["go generate", "make pb"]
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
